<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turbo Arena 3D</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="menu">
  <h1>Turbo Arena</h1>
  <p class="sub">Pick your car, then outscore the other team in 3 minutes.</p>
  <div id="cars"></div>
  <label class="sub">Opponents <select id="diff"><option value="0.85">Rookie</option><option value="1" selected>Pro</option><option value="1.12">Legend</option></select></label>
  <button id="start" onclick="if(!window.TURBO)alert('game.js or three.js did not load. Keep index.html, style.css and game.js in the same folder, and check your internet connection (three.js loads from a CDN).')">Kick off</button>
  <p class="help">W/S drive &nbsp;|&nbsp; A/D steer &nbsp;|&nbsp; Space jump, then Space again + W/A/S/D for a flip dodge &nbsp;|&nbsp; Shift boost &nbsp;|&nbsp; In the air: S nose up, W nose down &nbsp;|&nbsp; C ball cam &nbsp;|&nbsp; Esc menu</p>
</section>

<section id="wrap" class="hidden">
  <div id="hud"><div id="score"><b id="s0">0</b><span id="time">3:00</span><b id="s1">0</b></div></div>
  <div id="ring"><div id="boostnum">33</div><small>BOOST</small></div>
  <div id="cam">BALL CAM</div>
  <div id="banner"></div>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
