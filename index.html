<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turbo Arena</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<section id="menu">
  <h1>Turbo Arena</h1>
  <p class="sub">Pick your car, then score more goals than the other team in 3 minutes.</p>
  <div id="cars"></div>
  <button id="start">Kick off</button>
  <p class="help">Drive: W A S D or arrow keys &nbsp;|&nbsp; Boost: Space &nbsp;|&nbsp; Drift: Shift &nbsp;|&nbsp; Reset to menu: Esc</p>
</section>

<section id="wrap" class="hidden">
  <div id="hud">
    <div id="score"><b id="s0">0</b><span id="time">3:00</span><b id="s1">0</b></div>
    <div id="boostbox"><div id="boost"><i></i></div><span id="bval">33</span></div>
  </div>
  <canvas id="game"></canvas>
  <div id="banner"></div>
</section>
<script src="game.js"></script>
</body>
</html>
